<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MieRen - Produsen Mie Sayur Alami & Sehat">

  <style>
    * {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }
    img, canvas {
      -webkit-user-drag: none !important;
      -khtml-user-drag: none !important;
      -moz-user-drag: none !important;
      -o-user-drag: none !important;
      user-drag: none !important;
    }
    @media print {
      html, body {
        display: none !important;
        visibility: hidden !important;
      }
    }
    #screenshot-protection-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #111111;
      color: #ffffff;
      z-index: 999999;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // Disable Right-Click Context Menu
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    }, false);

    // Disable Dragging
    document.addEventListener('dragstart', function(e) {
      e.preventDefault();
    }, false);

    // Disable PrintScreen / Screenshot shortcuts & DevTools shortcuts
    document.addEventListener('keyup', function(e) {
      if (e.key === 'PrintScreen' || e.keyCode === 44) {
        if (navigator.clipboard) {
          navigator.clipboard.writeText('');
        }
        showProtectionOverlay('Tangkapan Layar Ditolak • MieRen Confidential');
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'PrintScreen' || e.keyCode === 44) {
        e.preventDefault();
        showProtectionOverlay('Tangkapan Layar Ditolak • MieRen Confidential');
      }
      if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
      }
      if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')) {
        e.preventDefault();
      }
      if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i'))) {
        e.preventDefault();
      }
    });

    function showProtectionOverlay(msg) {
      var overlay = document.getElementById('screenshot-protection-overlay');
      if (overlay) {
        overlay.innerText = msg || 'Tangkapan Layar Dibatasi demi Keamanan Produk MieRen';
        overlay.style.display = 'flex';
        setTimeout(function() {
          overlay.style.display = 'none';
        }, 2000);
      }
    }

    window.addEventListener('blur', function() {
      var overlay = document.getElementById('screenshot-protection-overlay');
      if (overlay) {
        overlay.innerText = 'Pratinjau Terlindungi • Konten Disembunyikan Saat Tangkapan Layar / Pindah Jendela';
        overlay.style.display = 'flex';
      }
    });

    window.addEventListener('focus', function() {
      var overlay = document.getElementById('screenshot-protection-overlay');
      if (overlay) {
        overlay.style.display = 'none';
      }
    });
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MieRen">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>

  <title>MieRen - Produsen Mie Sayur Alami</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="screenshot-protection-overlay">
    Pratinjau Terlindungi • Tangkapan Layar & Penyimpanan Gambar Dilarang
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
